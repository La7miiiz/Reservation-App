<div class="time-picker-wrapper">
  <div class="time-input" (click)="toggle()" tabindex="0" (blur)="close()">
    <svg class="clock-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    <span class="time-display" [class.placeholder]="!displayValue">
      {{ displayValue || (label || 'Choisir une heure') }}
    </span>
    <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <div class="time-dropdown" *ngIf="open" (mousedown)="$event.preventDefault()">
    <div class="time-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="filterResults()"
        placeholder="Filtrer (ex: 14)"
        (click)="$event.stopPropagation()"
        autocomplete="off"
      />
    </div>
    <div class="time-list">
      <button
        *ngFor="let t of filteredTimes"
        class="time-option"
        [class.selected]="selectedTime === t"
        (click)="selectTime(t)"
        type="button"
      >{{ t }}</button>
    </div>
  </div>
</div>
