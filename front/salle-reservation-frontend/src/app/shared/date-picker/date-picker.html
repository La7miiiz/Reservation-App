<div class="date-picker-wrapper">
  <div class="date-input" (click)="toggle()" tabindex="0" (blur)="close()">
    <svg class="calendar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span class="date-display" [class.placeholder]="!displayValue">
      {{ displayValue || 'Choisir une date' }}
    </span>
    <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

  <div class="calendar-dropdown" *ngIf="open" (mousedown)="$event.preventDefault()">
    <div class="calendar-header">
      <button class="cal-nav" (click)="prevMonth()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="cal-title">{{ monthNames[month] }} {{ year }}</span>
      <button class="cal-nav" (click)="nextMonth()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="calendar-weekdays">
      <span *ngFor="let label of dayLabels" class="weekday-label">{{ label }}</span>
    </div>
    <div class="calendar-grid">
      <span *ngFor="let _ of [].constructor(startOffset); let i = index" class="cal-day empty"></span>
      <span
        *ngFor="let day of daysInMonth"
        class="cal-day"
        [class.today]="isToday(day)"
        [class.selected]="isSelected(day)"
        [class.past]="isPast(day)"
        (click)="selectDay(day)"
      >{{ day }}</span>
    </div>
  </div>
</div>
