<header class="navbar">
  <div class="navbar-brand">
    <span class="brand-icon">&#9681;</span>
    <span class="brand-text">Room<span>Reserve</span></span>
  </div>

  <div class="navbar-right">
    <span class="user-greeting">
      <img
        *ngIf="avatarSeed"
        [src]="'https://api.dicebear.com/9.x/thumbs/svg?seed=' + avatarSeed"
        alt=""
        class="greeting-avatar-img"
      />
      <span *ngIf="!avatarSeed" class="greeting-avatar">{{ userName.charAt(0).toUpperCase() }}</span>
      {{ userName }}
    </span>
    <button class="btn-icon" (click)="goToProfile()" title="Profil">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </button>
    <button class="btn-icon btn-logout" (click)="logout()" title="Déconnexion">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</header>
