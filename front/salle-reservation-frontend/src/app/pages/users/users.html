<div class="page-layout">
  <app-side-nav></app-side-nav>
  <app-navbar></app-navbar>

  <main class="page-content">
    <div class="page-header">
      <div>
        <h1>Gestion des utilisateurs</h1>
        <p class="text-muted">{{ users.length }} utilisateur(s)</p>
      </div>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="spinner-lg"></div>
      <p>Chargement des utilisateurs...</p>
    </div>

    <div *ngIf="!loading && users.length === 0" class="empty-state">
      <h3>Aucun utilisateur</h3>
    </div>

    <div *ngIf="!loading" class="table-wrapper card">
      <table class="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>
              <div class="user-name-cell">
                <div class="user-avatar-small" [style.background]="'hsl(' + (user.nom?.length * 40 || 0) + ', 60%, 50%)'">
                  {{ (user.nom || '?')[0] | uppercase }}
                </div>
                {{ user.nom }}
              </div>
            </td>
            <td>{{ user.email }}</td>
            <td>
              <span class="role-badge" [class.role-admin]="user.role === 'ADMIN'">
                {{ user.role }}
              </span>
            </td>
            <td class="actions-cell">
              <button class="btn btn-primary btn-sm" (click)="openEdit(user)">Modifier</button>
              <button class="btn btn-danger btn-sm" (click)="deleteUser(user)">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div *ngIf="editModal" class="modal-overlay" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Modifier l'utilisateur</h2>
      <button class="modal-close" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [(ngModel)]="editingUser.nom" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="editingUser.email" />
      </div>
      <div class="form-group">
        <label>Rôle</label>
        <select [(ngModel)]="editingUser.role">
          <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" (click)="closeModal()">Annuler</button>
      <button class="btn btn-primary" (click)="saveUser()">Enregistrer</button>
    </div>
  </div>
</div>
