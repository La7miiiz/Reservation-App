<div class="page-layout">
  <app-side-nav></app-side-nav>
  <app-navbar></app-navbar>

  <main class="page-content">
    <div class="page-header">
      <h1>Historique des r&eacute;servations</h1>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="spinner-lg"></div>
      <p>Chargement...</p>
    </div>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>

    <div *ngIf="!loading && reservations.length === 0" class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <h3>Aucune r&eacute;servation</h3>
      <p>Vous n&rsquo;avez pas encore de r&eacute;servation.</p>
      <button class="btn btn-primary" routerLink="/reservations">R&eacute;server une salle</button>
    </div>

    <div *ngIf="!loading && reservations.length > 0" class="reservations-table-wrapper">
      <table class="reservations-table">
        <thead>
          <tr>
            <th>Salle</th>
            <th>D&eacute;but</th>
            <th>Fin</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let res of reservations">
            <td class="cell-room">{{ res.nom || res.salle?.nom || '-' }}</td>
            <td>{{ res.dateDebut | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ res.dateFin | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>
              <span class="status-badge" [ngClass]="getStatusClass(res.statut)">
                {{ res.statut }}
              </span>
            </td>
            <td class="cell-actions">
              <button class="btn btn-warning btn-sm" (click)="editReservation(res.id)" title="Modifier">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteReservation(res.id)" title="Supprimer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
