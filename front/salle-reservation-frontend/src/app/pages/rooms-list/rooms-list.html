<div class="page-layout">
  <app-side-nav></app-side-nav>
  <app-navbar></app-navbar>

  <main class="page-content">
    <div class="page-header">
      <div>
        <h1>Salles disponibles</h1>
        <p class="text-muted">{{ rooms.length }} salle(s) disponible(s)</p>
      </div>
      <button *ngIf="isAdmin" class="btn btn-primary" (click)="goToCreateRoom()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Ajouter une salle
      </button>
    </div>

    <div *ngIf="loading" class="loading-state">
      <div class="spinner-lg"></div>
      <p>Chargement des salles...</p>
    </div>

    <div *ngIf="!loading && rooms.length === 0" class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <h3>Aucune salle disponible</h3>
      <p *ngIf="isAdmin">Cr&eacute;ez la premi&egrave;re salle en cliquant sur "Ajouter une salle"</p>
    </div>

    <div *ngIf="!loading" class="grid-3">
      <div *ngFor="let salle of rooms" class="room-card card">
        <div class="room-card-header">
          <div class="room-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <h3>{{ salle.nom }}</h3>
        </div>

        <div class="room-card-body">
          <div class="room-capacity">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span>{{ salle.capacite }} personnes</span>
          </div>
          <p *ngIf="salle.description" class="room-desc">{{ salle.description }}</p>
        </div>

        <div class="room-card-footer">
          <button class="btn btn-primary btn-sm" (click)="reserveRoom(salle)">
            R&eacute;server
          </button>
          <div *ngIf="isAdmin" class="room-admin-actions">
            <button class="btn btn-warning btn-sm" (click)="editRoom(salle)">Modifier</button>
            <button class="btn btn-danger btn-sm" (click)="deleteRoom(salle)">Supprimer</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
